<!DOCTYPE html>
<html>
<head>
  <title>Car Racing Game</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.2/p5.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #222;
      font-family: Arial, sans-serif;
    }
    #game-container {
      position: relative;
    }
  </style>
</head>
<body>
<div id="game-container"></div>
<script>
let carX, carY, carWidth, carHeight;
let obstacles = [];
let coins = [];
let score = 0;
let gameOver = false;
let roadY = 0;
let speed = 5;

// Touch controls
let isTouchDevice = false;
let leftButton, rightButton, restartButton;
let leftPressed = false;
let rightPressed = false;

function setup() {
  let canvas = createCanvas(400, 600);
  canvas.parent('game-container');
  
  // Detect touch capability
  isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0 || navigator.msMaxTouchPoints > 0;
  
  carX = width / 2;
  carY = height - 60;
  carWidth = 40;
  carHeight = 60;
  
  // Initialize touch buttons
  if (isTouchDevice) {
    leftButton = { x: 50, y: height - 80, w: 80, h: 60 };
    rightButton = { x: width - 130, y: height - 80, w: 80, h: 60 };
    restartButton = { x: width/2 - 60, y: height/2 + 120, w: 120, h: 40 };
  }
  
  // Spawn initial obstacles and coins
  for (let i = 0; i < 3; i++) {
    obstacles.push({ x: random(50, width - 50), y: -i * 200 - 100, w: 40, h: 40 });
    coins.push({ x: random(50, width - 50), y: -i * 300 - 200, w: 20, h: 20 });
  }
}

function draw() {
  background(100); // Gray background for road
  
  // Draw road lines
  fill(255);
  for (let y = roadY; y < height; y += 40) {
    rect(width / 2 - 5, y, 10, 20);
  }
  roadY = (roadY + speed) % 40;

  if (!gameOver) {
    // Draw car
    fill(0, 0, 255);
    rect(carX - carWidth / 2, carY - carHeight / 2, carWidth, carHeight);

    // Move car with arrow keys or touch buttons
    if ((keyIsDown(LEFT_ARROW) || leftPressed) && carX > carWidth / 2) {
      carX -= 5;
    }
    if ((keyIsDown(RIGHT_ARROW) || rightPressed) && carX < width - carWidth / 2) {
      carX += 5;
    }

    // Update and draw obstacles
    for (let i = obstacles.length - 1; i >= 0; i--) {
      let obs = obstacles[i];
      obs.y += speed;
      fill(255, 0, 0);
      rect(obs.x - obs.w / 2, obs.y - obs.h / 2, obs.w, obs.h);
      
      // Check collision
      if (collideRectRect(carX - carWidth / 2, carY - carHeight / 2, carWidth, carHeight,
                          obs.x - obs.w / 2, obs.y - obs.h / 2, obs.w, obs.h)) {
        gameOver = true;
      }
      
      // Remove obstacles that go off screen
      if (obs.y > height + obs.h) {
        obstacles.splice(i, 1);
        obstacles.push({ x: random(50, width - 50), y: -100, w: 40, h: 40 });
      }
    }

    // Update and draw coins
    for (let i = coins.length - 1; i >= 0; i--) {
      let coin = coins[i];
      coin.y += speed;
      fill(255, 255, 0);
      ellipse(coin.x, coin.y, coin.w, coin.h);
      
      // Check coin collection
      if (collideRectCircle(carX - carWidth / 2, carY - carHeight / 2, carWidth, carHeight,
                            coin.x, coin.y, coin.w)) {
        score += 10;
        coins.splice(i, 1);
        coins.push({ x: random(50, width - 50), y: -100, w: 20, h: 20 });
      }
      
      // Remove coins that go off screen
      if (coin.y > height + coin.h) {
        coins.splice(i, 1);
        coins.push({ x: random(50, width - 50), y: -100, w: 20, h: 20 });
      }
    }

    // Increase difficulty
    speed = 5 + score / 100;
  }

  // Draw touch controls if on touch device
  if (isTouchDevice) {
    drawTouchControls();
  }

  // Draw score
  fill(255);
  textSize(20);
  textAlign(LEFT);
  text("Score: " + score, 10, 30);

  // Game over screen
  if (gameOver) {
    fill(0, 0, 0, 150);
    rect(0, 0, width, height);
    
    fill(255, 0, 0);
    textSize(40);
    textAlign(CENTER);
    text("Game Over", width / 2, height / 2);
    text("Score: " + score, width / 2, height / 2 + 50);
    textSize(20);
    
    if (isTouchDevice) {
      text("Tap Restart Button", width / 2, height / 2 + 100);
      // Draw restart button
      fill(0, 150, 0);
      rect(restartButton.x, restartButton.y, restartButton.w, restartButton.h);
      fill(255);
      textAlign(CENTER);
      text("RESTART", restartButton.x + restartButton.w/2, restartButton.y + restartButton.h/2 + 5);
    } else {
      text("Press R or Space to Restart", width / 2, height / 2 + 100);
    }
  }
}

function drawTouchControls() {
  if (gameOver) return;
  
  // Draw left button
  fill(leftPressed ? 100 : 50);
  stroke(255);
  strokeWeight(2);
  rect(leftButton.x, leftButton.y, leftButton.w, leftButton.h, 10);
  
  // Draw left arrow
  fill(255);
  noStroke();
  textAlign(CENTER);
  textSize(24);
  text("◀", leftButton.x + leftButton.w/2, leftButton.y + leftButton.h/2 + 8);
  
  // Draw right button
  fill(rightPressed ? 100 : 50);
  stroke(255);
  strokeWeight(2);
  rect(rightButton.x, rightButton.y, rightButton.w, rightButton.h, 10);
  
  // Draw right arrow
  fill(255);
  noStroke();
  textAlign(CENTER);
  textSize(24);
  text("▶", rightButton.x + rightButton.w/2, rightButton.y + rightButton.h/2 + 8);
}

// Touch event handlers
function touchStarted() {
  if (!isTouchDevice) return;
  
  let touchX = touches[touches.length - 1].x;
  let touchY = touches[touches.length - 1].y;
  
  // Check if touch is on left button
  if (touchX >= leftButton.x && touchX <= leftButton.x + leftButton.w &&
      touchY >= leftButton.y && touchY <= leftButton.y + leftButton.h && !gameOver) {
    leftPressed = true;
  }
  
  // Check if touch is on right button
  if (touchX >= rightButton.x && touchX <= rightButton.x + rightButton.w &&
      touchY >= rightButton.y && touchY <= rightButton.y + rightButton.h && !gameOver) {
    rightPressed = true;
  }
  
  // Check if touch is on restart button
  if (gameOver && touchX >= restartButton.x && touchX <= restartButton.x + restartButton.w &&
      touchY >= restartButton.y && touchY <= restartButton.y + restartButton.h) {
    restartGame();
  }
  
  return false; // Prevent default
}

function touchEnded() {
  if (!isTouchDevice) return;
  
  leftPressed = false;
  rightPressed = false;
  
  return false; // Prevent default
}

// Simple collision detection functions
function collideRectRect(x1, y1, w1, h1, x2, y2, w2, h2) {
  return x1 < x2 + w2 && x1 + w1 > x2 && y1 < y2 + h2 && y1 + h1 > y2;
}

function collideRectCircle(rx, ry, rw, rh, cx, cy, diameter) {
  let testX = cx;
  let testY = cy;
  if (cx < rx) testX = rx;
  else if (cx > rx + rw) testX = rx + rw;
  if (cy < ry) testY = ry;
  else if (cy > ry + rh) testY = ry + rh;
  let distX = cx - testX;
  let distY = cy - testY;
  let distance = sqrt(distX * distX + distY * distY);
  return distance <= diameter / 2;
}

// Restart game function
function restartGame() {
  score = 0;
  speed = 5;
  carX = width / 2;
  obstacles = [];
  coins = [];
  leftPressed = false;
  rightPressed = false;
  
  for (let i = 0; i < 3; i++) {
    obstacles.push({ x: random(50, width - 50), y: -i * 200 - 100, w: 40, h: 40 });
    coins.push({ x: random(50, width - 50), y: -i * 300 - 200, w: 20, h: 20 });
  }
  gameOver = false;
}

// Keyboard restart
function keyPressed() {
  if (key === 'r' || key === 'R' || key === ' ') {
    if (gameOver) {
      restartGame();
    }
  }
}
</script>
</body>
</html>
